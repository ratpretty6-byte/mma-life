name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install bandit vulture hypothesis pytest-xdist pytest-randomly coverage-badge

      - name: Lint (ruff)
        run: ruff check .

      - name: Type check (mypy)
        run: mypy .

      - name: Security audit (bandit)
        run: bandit -r . --exclude '/.opencode/,/templates/,/tests/,/node_modules/,/.venv/,/config/'

      - name: Dead code (vulture)
        run: vulture . --min-confidence 80 --exclude '.opencode,node_modules,templates,config'

      - name: Test with coverage
        run: python -m pytest -v --tb=short --cov=. --cov-report=term-missing:skip-covered

      - name: Coverage badge
        run: coverage-badge -o coverage.svg -f
