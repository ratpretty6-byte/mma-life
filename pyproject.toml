[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501", "E402"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
warn_unused_ignores = true
strict = false
check_untyped_defs = true
exclude = [
    "tests/",
    "world_sim.py",
    "analyze.py",
    "stats_fetcher.py",
    "mobile_compat.py",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
omit = [
    "web_server.py",
    "analyze.py",
    "stats_fetcher.py",
    "mobile_compat.py",
]
source = ["."]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
]
