repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.0
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v2.1.0
    hooks:
      - id: mypy
        args: [--no-strict-optional, --ignore-missing-imports]
        language: system
        pass_filenames: false

  - repo: https://github.com/PyCQA/bandit
    rev: 1.9.4
    hooks:
      - id: bandit
        args: [-r, ., --exclude, /.opencode/,/templates/,/tests/,/node_modules/,/.venv/,/config/]
        language: system

  - repo: https://github.com/jendrikseipp/vulture
    rev: v2.16
    hooks:
      - id: vulture
        args: [., --min-confidence, "80", --exclude, ".opencode,node_modules,templates,config"]
        language: system
        pass_filenames: false

  - repo: local
    hooks:
      - id: pytest
        name: pytest
        entry: python3 -m pytest
        args: [-v, --tb=short, --cov=.]
        language: system
        pass_filenames: false
        always_run: true
